name: Playwright Weekend Run

on:
  schedule:
    # 9:25 AM IST = 3:55 AM UTC
    - cron: '55 3 * * 6,0'
  workflow_dispatch:

env:
  TZ: Asia/Kolkata

jobs:
  student-attendance:
    name: Attendance - ${{ matrix.student }}
    timeout-minutes: 355

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        student: [SUE019441]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate students.csv from secret
        run: printf '%s' "$STUDENTS_CSV" > students.csv
        env:
          STUDENTS_CSV: ${{ secrets.STUDENTS_CSV }}

      - name: Run attendance for ${{ matrix.student }}
        run: npx playwright test tests/extract_lecture_links.spec.ts
        env:
          TZ: Asia/Kolkata
          STUDENT_USERNAME: ${{ matrix.student }}
          LMS_URL: ${{ secrets.LMS_URL }}
          HEADLESS: true
          DRY_RUN: false

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.student }}
          path: playwright-report/
          retention-days: 30
